name: Weekly schedule backup

on:
  schedule:
    # Monday 11:00 UTC = 7:00 AM Eastern
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Snapshot schedule workbook
        run: node scripts/backup-schedule.cjs
