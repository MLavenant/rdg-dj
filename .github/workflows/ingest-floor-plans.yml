name: Ingest booking floor plans

# When someone Saves a new booking link in Venue ROI Rules → 3D Floor plans,
# the app queues /rdg/floorPlanIngestRequests. This job grabs GLB + table IDs +
# tiers (same as the Oct 3 manual scrape) and writes the plan onto the drop —
# no coding required.

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Playwright
        run: |
          npm install
          npx playwright install chromium --with-deps
      - name: Process floor-plan queue
        run: node scripts/ingest-booking-floor-plan.cjs --process-queue
